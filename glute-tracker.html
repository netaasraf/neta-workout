@media (prefers-reduced-motion:reduce){#toast{transition:none}}

function nav(){var h="";DAYS.forEach(function(d,i){h+='<button data-i="'+i+'" class="'+(cur===i?"on":"")+'">יום '+(i+1)+"</button>"});
h+='<button data-i="p" class="'+(cur==="p"?"on":"")+'">התקדמות</button>';$("nav").innerHTML=h;
$("nav").onclick=function(e){var b=e.target.closest("button");if(!b)return;cur=b.dataset.i==="p"?"p":+b.dataset.i;RM=null;EM=false;render()}}
function day(){if(EM)return editDay();var d=DAYS[cur],h=(RM&&RM.day===cur?'<div class="tip up">'+RM.t+'</div>':'')+'<div class="day-title">'+d.n+'</div><p class="sub">'+d.t+'</p>';
d.ex.forEach(function(ex){var sg=sug(ex),dr=S.draft[ex.id]||[];
h+='<div class="card"><div class="hd">'+draw(ex)+'<div><h3>'+ex.n+'</h3><div class="meta">'+ex.s+" סטים × "+ex.lo+"–"+ex.hi+" חזרות · "+lastTxt(ex)+" · מנוחה: "+rl(ex)+'</div></div></div><div class="tip'+(sg.up?" up":"")+'">'+sg.msg+"</div>";
for(var i=0;i<ex.s;i++){var x=dr[i]||{},w=x.w!==undefined?x.w:sg.w;
h+='<div class="row"><span>סט '+(i+1)+'</span><input type="number" inputmode="decimal" step="any" min="0" placeholder="ק״ג" value="'+w+'" data-ex="'+ex.id+'" data-i="'+i+'" data-f="w"><input type="number" inputmode="numeric" min="0" placeholder="חזרות" value="'+(x.r||"")+'" data-ex="'+ex.id+'" data-i="'+i+'" data-f="r"></div>'}
h+="</div>"});
h+='<button class="ghost" id="ed">✏️ עריכת תרגילים</button><button class="save" id="sv">שמרי אימון</button>';$("main").innerHTML=h;$("ed").onclick=function(){EM=true;render()};
$("main").oninput=function(e){var t=e.target;if(!t.dataset.ex)return;var a=S.draft[t.dataset.ex]=S.draft[t.dataset.ex]||[];var o=a[+t.dataset.i]=a[+t.dataset.i]||{};o[t.dataset.f]=t.value;save()};
$("main").onchange=function(e){var t=e.target;if(t.dataset.f==="r"&&parseInt(t.value)>0){var x=findEx(t.dataset.ex);if(x)startRest(rest(x))}};
$("sv").onclick=function(){var d=DAYS[cur],n=0,dt=new Date().toISOString().slice(0,10);
d.ex.forEach(function(ex){var sets=[];for(var i=0;i<ex.s;i++){var x=(S.draft[ex.id]||[])[i]||{};var w=parseFloat(x.w),r=parseInt(x.r);
if(isNaN(w)){var sg=sug(ex);w=parseFloat(sg.w)}if(!isNaN(w)&&r>0)sets.push({w:w,r:r})}
if(sets.length){(S.log[ex.id]=S.log[ex.id]||[]).push({d:dt,day:cur,s:sets});n++}delete S.draft[ex.id]});
if(!n){toast("מלאי חזרות לפחות בתרגיל אחד");return}
S.sessions=(S.sessions||[]);S.sessions.push({d:dt,day:cur});save();RM={day:cur,t:RMSG[cur]};toast("האימון נשמר 💗");render()}}
function prog(){var all=[];DAYS.forEach(function(d){d.ex.forEach(function(ex){all.push(ex)})});
var ss=S.sessions||[],wk=ss.filter(function(s){return(Date.now()-new Date(s.d))/864e5<7}).length;
var h='<div class="day-title">ההתקדמות שלך</div><div class="stats"><div class="stat"><b>'+wk+'/4</b>אימונים ב־7 ימים</div><div class="stat"><b>'+ss.length+'</b>אימונים בסך הכל</div></div>';
var any=0;all.forEach(function(ex){var hh=hist(ex.id);if(!hh.length)return;any=1;
var f=best(hh[0]),l=best(hh[hh.length-1]),p=f?(l-f)/f*100:0,lw=hh[hh.length-1].s;var mx=Math.max.apply(null,lw.map(function(x){return x.w}));
h+='<div class="card"><h3>'+ex.n+'</h3><div class="meta">'+hh.length+" אימונים · משקל נוכחי "+mx+' ק״ג</div><span class="pct'+(p<0?" neg":"")+'">'+(p>=0?"+":"")+p.toFixed(1)+'%</span> <span class="meta">מאז האימון הראשון (כוח משוער)</span><div class="bar"><i style="width:'+Math.max(4,Math.min(100,50+p))+'%"></i></div></div>'});
if(!any)h+='<div class="card">עדיין אין נתונים. שמרי את האימון הראשון והאחוזים יופיעו כאן.</div>';
h+='<p class="note">איך זה עובד: כשכל הסטים מגיעים לטקסט העליון של טווח החזרות, האפליקציה תציע להעלות משקל. כוח משוער מחושב לפי הסט החזק ביותר (חזרות × משקל).</p>';
h+='<p class="note">טיפ לעלייה במסה: את ב־168 ס״מ ו־50 ק״ג, אז חשוב לאכול בעודף קלוריות קל (כ־250–300 קק״ל מעל התחזוקה), ולכוון ל־1.6–2 גרם חלבון לק״ג.</p>';
h+='<button class="ghost" id="rs">איפוס כל הנתונים</button>';$("main").innerHTML=h;
$("rs").onclick=function(){if(confirm("למחוק את כל הנתונים?")){S={log:{},draft:{}};save();render()}}}
function render(){nav();if(cur==="p")prog();else day();window.scrollTo(0,0)}
render();
</script>
</body>
</html>
